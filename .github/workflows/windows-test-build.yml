name: Windows test build

# Manual, unsigned Windows build for trying a branch or fork.
# Run it from the Actions tab ("Run workflow"), then download the
# "mermark-windows" artifact from the finished run. It does not create a
# release and needs no signing secrets (updater artifacts are disabled by
# src-tauri/tauri.windows-test.conf.json).

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: pnpm install

      - name: Build
        run: pnpm tauri build --config src-tauri/tauri.windows-test.conf.json

      - name: Upload executables
        uses: actions/upload-artifact@v4
        with:
          name: mermark-windows
          if-no-files-found: error
          path: |
            src-tauri/target/release/*.exe
            src-tauri/target/release/bundle/nsis/*.exe
